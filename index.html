<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>擇木專案進度</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column of project cards; each card = name, stacked stage bar, priority + report controls, foldable work items */
:root{
  --bg:#f5f6f1; --surface:#ffffff; --fg:#1c2920; --muted:#5d6a61; --line:#dde3da;
  --s0:#e6eae3; --s1:#a9cdb7; --s2:#5f9f7d; --s3:#2b6248;
  --accent:#2b6248; --accent-soft:#e1eee6; --gold:#9c7119; --gold-soft:#f5ebd5; --hi:#b5462b; --hi-soft:#f6e3dc;
  --f-display:"Noto Serif TC","Songti TC",serif; --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121915; --surface:#1a231e; --fg:#e5ebe6; --muted:#98a69d; --line:#2b372f;
  --s0:#26312a; --s1:#355e48; --s2:#4f9a73; --s3:#8fd3ad;
  --accent:#8fd3ad; --accent-soft:#20352a; --gold:#e2b75e; --gold-soft:#3a3020; --hi:#f0957a; --hi-soft:#3d2620; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121915; --surface:#1a231e; --fg:#e5ebe6; --muted:#98a69d; --line:#2b372f;
  --s0:#26312a; --s1:#355e48; --s2:#4f9a73; --s3:#8fd3ad;
  --accent:#8fd3ad; --accent-soft:#20352a; --gold:#e2b75e; --gold-soft:#3a3020; --hi:#f0957a; --hi-soft:#3d2620; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-display);font-size:1.8rem;margin:0}
.lede{color:var(--muted);margin:.3rem 0 0;max-width:60ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.status{margin-top:10px;font-size:.82rem;color:var(--muted)}
.agenda{margin-top:18px;padding:14px 16px;border-radius:10px;background:var(--hi-soft)}
.agenda h2{font-family:var(--f-display);font-size:1rem;margin:0 0 4px;color:var(--hi)}
.agenda ol{margin:0;padding-left:1.3em}
.agenda .empty{color:var(--muted);font-size:.9rem}
.group{margin-top:28px}
.group>h2{font-family:var(--f-display);font-size:1.1rem;margin:0 0 10px;display:flex;gap:10px;align-items:baseline}
.group>h2 small{font-family:var(--f-body);font-size:.8rem;color:var(--muted);font-weight:400}
.cards{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card.rep{border-color:var(--hi)}
.head{display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:start}
.name{font-weight:700;font-size:1.05rem;text-wrap:balance}
.star{font-size:.72rem;font-weight:700;color:var(--gold);background:var(--gold-soft);padding:1px 8px;border-radius:999px;margin-left:6px;white-space:nowrap;vertical-align:2px}
.lead{font-size:.82rem;color:var(--muted)}
.pct{font-family:var(--f-display);font-size:1.9rem;line-height:1;text-align:right;font-variant-numeric:tabular-nums;grid-row:1/3;grid-column:2}
.pct small{font-size:.9rem;color:var(--muted)}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--s0);margin:12px 0 6px;gap:2px}
.bar{position:relative}.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--s2);border-radius:7px}
.counts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.ctrl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:.85rem;border:0;background:transparent;color:var(--fg);padding:5px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:700}
.seg button:disabled{cursor:not-allowed;opacity:.6}
.lbl{font-size:.8rem;color:var(--muted);margin-right:6px}
.rep-tog{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;cursor:pointer}
.rep-tog input{width:18px;height:18px;accent-color:var(--hi);margin:0}
details{margin-top:10px}
summary{cursor:pointer;font-size:.85rem;color:var(--accent);font-weight:500}
.rows{margin-top:12px;display:grid;gap:0}
.r{display:grid;grid-template-columns:auto auto auto minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
.r .no{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);min-width:1.6em;text-align:right;align-self:center}
.r .no b{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;border:1px solid var(--line);color:var(--fg);font-weight:500}
.r .h{font:inherit;border:0;background:transparent;color:var(--muted);cursor:grab;touch-action:none;padding:2px 4px;font-size:1rem;line-height:1;align-self:center;border-radius:4px}
.r .h:hover{color:var(--fg);background:var(--bg)}
.r.dragging{background:var(--accent-soft);box-shadow:0 4px 14px rgba(0,0,0,.12);position:relative;z-index:2;border-radius:6px}
.r.dragging .h{cursor:grabbing}
.nb{font:inherit;font-family:var(--f-mono);font-size:.72rem;width:1.5em;height:1.5em;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;padding:0}
.nb.par{border-style:dashed;color:var(--accent)}
.nb:hover{border-color:var(--accent)}
.sep[data-key]{user-select:none}
.sep{font-size:.75rem;color:var(--muted);padding:10px 0 2px;border-top:1px solid var(--line)}
.pre{font-size:.8rem;color:var(--accent);margin-top:2px}
.r .dot{width:10px;height:10px;border-radius:50%;display:inline-block;align-self:center}
.r .lab{min-width:0}
.op{font-size:.72rem;color:var(--muted);margin-left:6px;white-space:nowrap}
.tl{list-style:none;margin:3px 0 0;padding:0 0 0 10px;border-left:2px solid var(--line);display:grid;gap:2px}
.tl li{font-size:.8rem;color:var(--muted);line-height:1.5}
.tl li.new{color:var(--fg);font-size:.85rem}
.tl time{font-variant-numeric:tabular-nums;white-space:nowrap}
.tl .w{font-size:.72rem;color:var(--muted);margin-left:6px}
.tl .k{font-size:.7rem;font-weight:700;padding:0 6px;border-radius:4px;margin-right:4px;background:var(--accent-soft);color:var(--accent)}
.tl .k-卡關,.tl .k-狀態{background:var(--hi-soft);color:var(--hi)}
.r .lab em.none{opacity:.6}
.r .lab em{font-style:normal;font-size:.8rem;color:var(--muted);display:block}
.r .who{font-size:.82rem;text-align:right;white-space:nowrap}
.r .who b{font-weight:700}
.r .who span{color:var(--muted);display:block;font-size:.75rem}
.r .stg{font-size:.72rem;color:var(--muted)}
.r.s0 .dot{background:var(--s0);box-shadow:inset 0 0 0 1px var(--muted)}.r.s1 .dot{background:var(--s1)}.r.s2 .dot{background:var(--s2)}.r.s3 .dot{background:var(--s3)}
.r.todo .who b{color:var(--hi)}
.pp{display:flex;gap:8px;grid-column:1/-1}.pp input{flex:1;min-width:0;width:auto}
@media (max-width:600px){.r{grid-template-columns:auto auto auto minmax(0,1fr)}.r .who{grid-column:4;text-align:left;white-space:normal}.r .who span{display:inline;margin-left:6px}}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.item:last-child{border-bottom:0}
.item .t{min-width:0}
.item .code{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-left:6px}
.steps{display:inline-flex;gap:3px}
.steps button{font:inherit;font-size:.75rem;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.steps button.on{color:var(--surface);border-color:transparent}
.steps button.on.s0{background:var(--muted)}.steps button.on.s1{background:var(--s1);color:var(--fg)}.steps button.on.s2{background:var(--s2)}.steps button.on.s3{background:var(--s3)}
.steps button:disabled{cursor:not-allowed}
.note{grid-column:1/-1;width:100%;box-sizing:border-box;font:inherit;font-size:.85rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:600px){.item{grid-template-columns:1fr}.pct{font-size:1.5rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<p class="lede">擇木雙週會的案子收攏成 13 個專案，只看進度、不列期限。執行長在每個專案設定輕重緩急，並勾選下次會議想聽的報告；每次進度與收到紀錄都取自 EIP，最新在最上面（括號為更新日期），同仁照常在 EIP 回報即可。每項列主責與協助，看得出卡在誰；編號是做事順序，同號可同時進行，按住 ⠿ 拖曳可調整順序，點編號可設為與上一步同時。</p>

let saving=0;
async function save(path,data){saving++;try{return await save_(path,data)}finally{saving--}}
async function save_(path,data){const id=path.split("/")[1];const p=P.find(x=>x.id===id);try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({id,name:p?p.name:"",data})});const j=await r.json();if(!j.ok)throw new Error(j.error||"save");say("已儲存。")}catch(e){say("沒有存到，請稍後再試。");throw e}}

async function saveOrder(pid,order,par){const cur=projs[pid]||{};const nx={...cur,order,par:[...par],at:new Date().toISOString()};const old=projs[pid];projs[pid]=nx;render();try{await save("projects/"+pid,nx)}catch(_){projs[pid]=old;render()}}
function domOrder(c){return [...c.children].map(x=>x.dataset.key).filter(Boolean)}
document.addEventListener("pointerdown",e=>{const hd=e.target.closest(".h");if(!hd||!db)return;e.preventDefault();const row=hd.closest(".r"),c=row.parentElement;dragging={row,c,pid:c.dataset.p,start:domOrder(c).join()};row.classList.add("dragging");try{hd.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener("pointermove",e=>{if(!dragging)return;const {row,c}=dragging;const sibs=[...c.children].filter(x=>x!==row&&x.dataset.key);for(const s of sibs){const r=s.getBoundingClientRect();if(e.clientY<r.top+r.height/2){if(row.nextElementSibling!==s)c.insertBefore(row,s);return}}if(c.lastElementChild!==row)c.appendChild(row)});
async function endDrag(){if(!dragging)return;const {row,c,pid,start}=dragging;row.classList.remove("dragging");dragging=null;const o=domOrder(c);if(o.join()!==start){const p=P.find(x=>x.id===pid);await saveOrder(pid,o,layout(p).par)}else if(pending){pending=false;render()}if(pending){pending=false;render()}}
document.addEventListener("pointerup",endDrag);document.addEventListener("pointercancel",endDrag);
document.addEventListener("keydown",async e=>{const hd=e.target.closest&&e.target.closest(".h");if(!hd||!db||(e.key!=="ArrowUp"&&e.key!=="ArrowDown"))return;e.preventDefault();const row=hd.closest(".r"),c=row.parentElement,pid=c.dataset.p,o=domOrder(c),k=row.dataset.key,j=o.indexOf(k),t=e.key==="ArrowUp"?j-1:j+1;if(t<0||t>=o.length)return;[o[j],o[t]]=[o[t],o[j]];const p=P.find(x=>x.id===pid);await saveOrder(pid,o,layout(p).par);const el=document.querySelector(`.h[data-drag="${k}"]`);if(el)el.focus()});
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b||!db)return;
  if(b.dataset.par){const p=P.find(x=>x.id===b.dataset.pid),L=layout(p),k=b.dataset.par;L.par.has(k)?L.par.delete(k):L.par.add(k);await saveOrder(p.id,L.order,L.par);return}
  if(b.dataset.prio!==undefined){const id=b.dataset.p,cur=projs[id]||{};const v=cur.prio===b.dataset.prio?"":b.dataset.prio;const nx={...cur,prio:v,at:new Date().toISOString()};const old=projs[id];projs[id]=nx;render();try{await save("projects/"+id,nx)}catch(_){projs[id]=old;render()}}
  else if(b.dataset.k){const k=b.dataset.k,cur=items[k]||{};const p=P.find(p=>p.items.some((_,i)=>key(p,i)===k));const i=p.items.findIndex((_,i)=>key(p,i)===k);const nx={...full(p,i),stage:+b.dataset.s,at:new Date().toISOString()};const old=items[k];items[k]=nx;render();try{await save("items/"+k,nx)}catch(_){items[k]=old;render()}}});
document.addEventListener("change",async e=>{const t=e.target;if(!db)return;
  if(t.dataset.rep){const id=t.dataset.rep,cur=projs[id]||{};const nx={...cur,report:t.checked,at:new Date().toISOString()};const old=projs[id];projs[id]=nx;render();try{await save("projects/"+id,nx)}catch(_){projs[id]=old;render()}}
  else if(t.dataset.note||t.dataset.own||t.dataset.help){const k=t.dataset.note||t.dataset.own||t.dataset.help;const f=t.dataset.note?"note":t.dataset.own?"owner":"help";const p=P.find(p=>p.items.some((_,i)=>key(p,i)===k));const i=p.items.findIndex((_,i)=>key(p,i)===k);const cur=full(p,i);const v=t.value.trim();if(v===cur[f])return;const nx={...cur,[f]:v,at:new Date().toISOString()};const old=items[k];items[k]=nx;render();try{await save("items/"+k,nx)}catch(_){items[k]=old;render()}}});
{const t=new Date(Date.parse(SYNCED)+8*36e5);document.getElementById("synced").textContent=`進度同步自 EIP：${t.getUTCMonth()+1}/${t.getUTCDate()} ${String(t.getUTCHours()).padStart(2,"0")}:${String(t.getUTCMinutes()).padStart(2,"0")}（每天早上自動更新）`}
render();
async function load(first){if(dragging||saving)return;try{const r=await fetch(API);const j=await r.json();if(!j.ok)throw 0;if(saving)return;const sv=j.projects||{};for(const k of new Set([...Object.keys(projs),...Object.keys(sv)])){const a=projs[k],b=sv[k];if(!b)continue;if(a&&a.at&&(!b.at||a.at>b.at))continue;projs[k]=b}db={};ro=false;render();if(first)say("點選即自動儲存；每分鐘自動更新。")}catch(_){if(first)say("目前連不到資料表，以下為最新進度快照。")}}
load(true);setInterval(()=>load(false),60000);
</script>
</body>
</html>
